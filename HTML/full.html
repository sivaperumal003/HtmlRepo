<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full-Screen Image</title>
  <style>
    /* Remove default margins */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Container for the image */
    .fullscreen-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Image styling */
    .fullscreen-image img {
      width: 80%;
      height: 80%;
      object-fit: cover;
    }
  </style>
</head>
<body>
    <center>
        <div class="fullscreen-image">
            <a href="https://www.peakpx.com/en/hd-wallpaper-desktop-nmvna">
                <img src="https://w0.peakpx.com/wallpaper/711/168/HD-wallpaper-anupama-parameswaran-actress-anupamaparameswaran-malayalam-telugu.jpg" 
                alt="Full-Screen Image"></a> 
          </div>
    </center>
  
</body>
</html>
